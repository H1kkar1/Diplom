apiVersion: apps/v1
kind: Deployment
metadata:
  name: 
  namespace: 
  labels:
    app: 
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 
  template:
    metadata:
      labels:
        app: 
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
        args:
          - /usr/local/etc/redis/redis.conf
        env:
        - name: REDIS_MAXMEMORY
          value: 
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: 
            cpu: 
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: -config
      - name: redis-storage
        persistentVolumeClaim:
          claimName: -pvc