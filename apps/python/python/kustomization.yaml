apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: python
  namespace: flux-system
  labels:
    app: python
    team: python
spec:
  interval: 5m
  path: ./apps/python/python
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: python
      namespace: python