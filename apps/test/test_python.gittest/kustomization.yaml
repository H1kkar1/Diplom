apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: test-python-service
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/test/test_python.gittest
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: test-python-service
      namespace: test