apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  namespace: test
  labels:
    app: test
    team: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
        team: test
    spec:
      containers:
      - name: app
        image: ghcr.io/your-org/test:latest
        ports:
        - containerPort: 8000
        env:
        - name: NAMESPACE
          value: test
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"